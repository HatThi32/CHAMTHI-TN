name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài các thư viện hệ thống cần cho Buildozer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            automake build-essential ccache libltdl-dev

      - name: Cài Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Build APK bằng Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Tải lên file APK (để bạn tải về máy)
        uses: actions/upload-artifact@v4
        with:
          name: cham-thi-trac-nghiem-apk
          path: bin/*.apk
