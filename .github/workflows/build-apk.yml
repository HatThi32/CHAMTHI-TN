name: Build APK Cham Thi

on:
  push:
    branches: [ webapp ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Chép app web vào dự án Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Đặt APK vào nhánh "apk" để tải về
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp build.log out/build-log.txt || echo "không có log" > out/build-log.txt
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/ChamThi.apk
            cp android/native-version.txt out/version.txt
            echo "THANH CONG - ban build so ${{ github.run_number }} - $(date -u)" > out/TRANG-THAI.txt
          else
            echo "LOI - ban build so ${{ github.run_number }} - $(date -u)" > out/TRANG-THAI.txt
          fi
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "APK ban build ${{ github.run_number }} tu ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

      - name: Tải lên APK (dự phòng)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChamThi-apk
          path: android/app/build/outputs/apk/release/app-release.apk
