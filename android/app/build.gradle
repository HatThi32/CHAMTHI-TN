plugins { id 'com.android.application' }
def nativeVersion = Integer.parseInt(rootProject.file('native-version.txt').text.trim())
android {
    namespace 'vn.chamthi.app'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.chamthi.app'
        minSdk 24
        targetSdk 34
        versionCode nativeVersion
        versionName '1.' + nativeVersion
    }
    signingConfigs {
        fixed {
            storeFile rootProject.file('chamthi.keystore')
            storePassword 'chamthi2026'
            keyAlias 'chamthi'
            keyPassword 'chamthi2026'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
